name: Deploy Worker

# Deploys when the Worker (or this file) changes on this branch; also runnable manually
# once the workflow exists on the default branch.
on:
  workflow_dispatch:
  push:
    branches: [design/wordpop-1.9-ui]
    paths: ['worker/**', '.github/workflows/deploy-worker.yml']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix worker ci || npm --prefix worker install
      - run: npm --prefix worker test
      - name: Check Cloudflare credentials (no secrets printed)
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        continue-on-error: true
        run: |
          echo "token length: ${#T}  account id length: ${#A}"
          curl -s -H "Authorization: Bearer $T" https://api.cloudflare.com/client/v4/user/tokens/verify | python3 -c "import sys,json;d=json.load(sys.stdin);print('token verify:',d.get('success'),(d.get('result') or {}).get('status'),[e.get('message') for e in (d.get('errors') or [])])"
          curl -s -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/accounts/$A/workers/scripts" | python3 -c "import sys,json;d=json.load(sys.stdin);print('scripts list:',d.get('success'),[e.get('message') for e in (d.get('errors') or [])],[x.get('id') for x in (d.get('result') or [])])"
      - uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: "4"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
