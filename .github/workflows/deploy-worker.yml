name: Deploy Worker

# Deploys when the Worker (or this file) changes on this branch; also runnable manually
# once the workflow exists on the default branch.
on:
  workflow_dispatch:
  push:
    branches: [design/wordpop-1.9-ui]
    paths: ['worker/**', '.github/workflows/deploy-worker.yml']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix worker ci || npm --prefix worker install
      - run: npm --prefix worker test
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
