name: Build APK

on:
  push:
    branches: [main, master, fix/android-36-keystore-inexact-alarms, feature/centralized-ai-api-settings]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test Cloudflare Worker
        run: npm --prefix worker test

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run tests, lint and build debug APK
        run: gradle testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk WordPop.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: WordPop-APK
          path: WordPop.apk

      - name: Publish APK to the "latest" release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: WordPop - آخر نسخة
          body: حمّل ملف WordPop.apk وثبّته على موبايلك.
          files: WordPop.apk
